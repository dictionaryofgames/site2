<!DOCTYPE html>
<html>
<head>
    <title>Изучение: {{ flashcard.title }}</title>
    <style>
        .study-container {
            max-width: 600px;
            margin: 50px auto;
            text-align: center;
        }
        .flashcard {
            background: white;
            border: 2px solid #3498db;
            border-radius: 10px;
            padding: 40px;
            margin: 20px 0;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .flashcard:hover {
            transform: scale(1.02);
        }
        .front {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .back {
            font-size: 20px;
            color: #2ecc71;
            display: none;
        }
        .flashcard.revealed .back {
            display: block;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-success { background-color: #2ecc71; color: white; }
    </style>
</head>
<body>
    <div class="study-container">
        <h1>{{ flashcard.title }}</h1>
        <p>{{ index }}/{{ total }}</p>
        
        {% if current_item %}
        <div class="flashcard" onclick="this.classList.toggle('revealed')">
            <div class="front">{{ current_item.front }}</div>
            <div class="back">{{ current_item.back }}</div>
        </div>
        
        <p>Нажмите на карточку, чтобы увидеть ответ</p>
        
        <a href="{% url 'flashcards:study' flashcard.pk %}?index={{ index|add:1 }}" class="btn btn-primary">Далее →</a>
        {% else %}
            <p>{{ message }}</p>
        {% endif %}
        
        <br><br>
        <a href="{% url 'flashcards:list' %}" class="btn btn-primary">← Назад к списку</a>
    </div>
</body>
</html>
